name: Tourism Package ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-save-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset
        run: python src/validate_data.py

      - name: Prepare train-test data
        run: python src/prepare_data.py

      - name: Train and evaluate model
        run: python src/train_model.py

      - name: Upload train-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-tourism-data
          path: artifacts/

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model
          path: models/

      - name: Commit updated model and metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add models/best_model.pkl models/metrics.json
          git diff --staged --quiet || git commit -m "Update trained model and metrics"
          git push
