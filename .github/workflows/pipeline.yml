name: Tourism Package ML Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate dataset
        run: python src/validate_data.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: data/Tourism.csv

  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: data
      - name: Prepare train-test data
        run: python src/prepare_data.py
      - name: Upload train-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-tourism-data
          path: artifacts/

  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download train-test splits
        uses: actions/download-artifact@v4
        with:
          name: processed-tourism-data
          path: artifacts
      - name: Train and evaluate model
        run: python src/train_model.py
      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model
          path: models/
      - name: Commit updated model and metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git add models/best_model.pkl models/metrics.json
          git diff --staged --quiet || git commit -m "Update trained model and metrics"
          git push
