name: Tourism Package ML Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ============================================================
  # JOB 1: DATA REGISTRATION / VALIDATION
  # ============================================================
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate dataset
        run: |
          python src/validate_data.py


  # ============================================================
  # JOB 2: DATA PREPARATION
  # ============================================================
  prepare-data:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare train-test data
        run: |
          python src/prepare_data.py

      - name: Upload train-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: processed-tourism-data
          path: artifacts/
          retention-days: 7


  # ============================================================
  # JOB 3: MODEL BUILDING / TRAINING / EVALUATION
  # ============================================================
  train-model:
    name: Model Training
    needs: prepare-data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download train-test artifact
        uses: actions/download-artifact@v4
        with:
          name: processed-tourism-data
          path: artifacts/

      - name: Train and evaluate model
        run: |
          python src/train_model.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourism-model
          path: models/
          retention-days: 7

      - name: Commit updated model and metrics
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git add models/best_model.pkl models/metrics.json

          git diff --staged --quiet || git commit -m "Update trained model and metrics"

          git push
